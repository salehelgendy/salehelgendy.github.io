<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رموز QR لأبواب الملف الرمضاني التفاعلي</title>
<link rel="stylesheet" href="style.css">
<style>
.qwrap{max-width:1000px;margin:20px auto;padding:0 16px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.qc{border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;break-inside:avoid;background:#fff}
.qc canvas{width:150px;height:150px;display:block;margin:6px auto}
.qc b{display:block;color:var(--navy);font-weight:600;line-height:1.5}
.qc small{color:var(--muted)}
.qc.main{border:2px solid var(--teal)}
@media print{.noprint{display:none}.top{position:static}.qgrid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand-r" href="./"><img src="img/sheikh-white.png" alt="الشيخ أ.د. سعد الخثلان" width="97" height="64"></a>
  <div class="mid" style="color:#fff;font-family:Expo;font-weight:700;font-size:1.2rem">رموز QR للطباعة</div>
  <a class="brand-l" href="./"><img src="img/logo-white.png" alt="منارات الهدى" width="57" height="62"></a>
</div></header>
<div class="qwrap">
  <p class="noprint">لكل باب رمز يفتح الملف على هذا الباب مباشرة. اطبعها في المساجد والمطويات. <button class="btn pri" onclick="print()">اطبع الصفحة</button> <a class="btn" href="./">رجوع للملف</a></p>
  <div class="qgrid" id="g"></div>
</div>
<script src="qr-lib.js"></script>
<script>
const base=new URL(".",location.href).href;
function qr(cv,text){const q=new QRCode(-1,QRLevel.M);q.addData(text);q.make();const n=q.getModuleCount(),s=cv.width,c=s/(n+2),x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,s,s);x.fillStyle="#182d58";for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect((k+1)*c,(r+1)*c,Math.ceil(c),Math.ceil(c));}
fetch("data.json").then(r=>r.json()).then(D=>{
  const secs=[...new Set(D.items.map(d=>d.section))];
  const cards=[["الملف الرمضاني التفاعلي",base,"كل المواد","main"]].concat(secs.map((s,i)=>[s,base+"?sec="+i,D.items.filter(d=>d.section===s).length+" مادة",""]));
  document.getElementById("g").innerHTML=cards.map((c,i)=>`<div class="qc ${c[3]}"><canvas width="600" height="600" id="c${i}"></canvas><b>${c[0]}</b><small>${c[2]}</small></div>`).join("");
  cards.forEach((c,i)=>qr(document.getElementById("c"+i),c[1]));
});
</script>
</body>
</html>
